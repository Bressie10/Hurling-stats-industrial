<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/gaastat-icon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#6B1B2B" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="GAAstat" />
		%sveltekit.head%
		<!-- Fonts for landing page -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// SvelteKit auto-registers /service-worker.js. Unregister the legacy
			// /sw.js worker so existing installs migrate to the new one.
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.getRegistrations().then((regs) => {
						for (const reg of regs) {
							if (reg.active && reg.active.scriptURL.endsWith('/sw.js')) reg.unregister()
						}
					})
				})
			}
		</script>
	</body>
</html>
